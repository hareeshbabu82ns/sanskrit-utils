[pytest]
testpaths = tests
# lets a bare `pytest` find the sanskrit_utils package
pythonpath = .
addopts = -ra
filterwarnings =
    # sanskrit_util's ORM models predate SQLAlchemy 2
    ignore::sqlalchemy.exc.SAWarning
    ignore::sqlalchemy.exc.LegacyAPIWarning
    ignore::sqlalchemy.exc.MovedIn20Warning
